[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-qa-factory"
version = "0.2.0"
description = "Model-driven 3D scene screening, question generation and reviewed follow-up tasks"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
batch = ["pyarrow"]
render = ["numpy>=1.24,<3", "trimesh>=4,<5", "pyrender>=0.1.45", "Pillow>=10", "scipy>=1.10"]

[project.scripts]
sceneqa = "scene_factory.cli:main"

[tool.setuptools.packages.find]
include = ["scene_factory*"]

[tool.setuptools.package-data]
scene_factory = ["static/*.html", "static/blind-agent/*.cjs", "static/blind-agent/*.json", "prompts/*.txt"]
"scene_factory.screening" = ["prompts/*.txt"]
